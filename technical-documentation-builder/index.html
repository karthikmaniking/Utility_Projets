<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technical Documentation Builder</title>
<style>
*{box-sizing:border-box} body{margin:0;font:14px Arial,sans-serif;background:#f1f5f9;color:#0f172a}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:5}.btn{border:1px solid #cbd5e1;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.layout{max-width:1300px;margin:auto;padding:20px;display:grid;grid-template-columns:380px 1fr;gap:24px}.editor{display:grid;gap:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px}.field{width:100%;margin-top:5px;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.row{display:flex;gap:6px;margin:6px 0}.label{font-size:11px;font-weight:bold;color:#64748b;text-transform:uppercase}.sectionEditor{margin-top:14px}.a4{width:210mm;min-height:297mm;background:white;padding:16mm;margin:auto;box-shadow:0 10px 30px #0002}.titleLine{border-bottom:4px solid #2563eb;padding-bottom:20px;margin-bottom:32px}.eyebrow{font-size:11px;font-weight:bold;letter-spacing:2px;color:#2563eb}.docSection{margin-bottom:34px}.docSection h2{font-size:24px;margin-bottom:4px}.docSection h3{color:#64748b}.code{background:#020617;color:#f8fafc;padding:15px;border-radius:10px;white-space:pre-wrap}.output{background:#ecfdf5;border:1px solid #a7f3d0;padding:15px;border-radius:10px;white-space:pre-wrap}.hidden{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.a4{width:100%;min-height:auto;padding:8vw}}@page{size:A4;margin:14mm}@media print{.no-print,.editor{display:none!important}.layout{display:block;padding:0}.a4{width:auto;min-height:auto;box-shadow:none;padding:0}.docSection{break-inside:avoid}}
</style>
</head><body>
<header class="top no-print"><b>TechDoc Builder <small id="status"></small></b><div><button class="btn" id="previewBtn">A4 Preview</button> <button class="btn primary" onclick="window.print()">Print / Save PDF</button></div></header>
<main class="layout" id="layout"><aside class="editor" id="editor"><div class="card"><div class="label">Document title</div><input id="title" class="field"><div class="label" style="margin-top:12px">Introduction</div><textarea id="summary" class="field" rows="4"></textarea></div><div id="sectionEditors"></div><button class="btn" id="addSection">+ Add section</button></aside><section><article class="a4"><div class="titleLine"><div class="eyebrow">TECHNICAL DOCUMENTATION</div><h1 id="pTitle"></h1><p id="pSummary"></p></div><div id="preview"></div></article></section></main>
<script src="app.js"></script></body></html>
